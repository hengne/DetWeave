name: Native build candidates
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['codex/release-*']
permissions:
  contents: read
jobs:
  ios-simulator:
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: packaging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install briefcase==0.4.7
      - run: xcodebuild -showsdks
      - run: briefcase create iOS --no-input
      - run: briefcase build iOS --no-input
      - name: Package simulator app and Xcode project
        run: |
          set -euo pipefail
          APP="build/detweave_native/ios/xcode/build/Debug-iphonesimulator/DetWeave.app"
          test -d "$APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/DetWeave-iOS-simulator.zip
          # Include the generated source, resources and Python support dependencies.
          ditto -c -k --sequesterRsrc --keepParent build/detweave_native/ios/xcode dist/DetWeave-iOS-Xcode-project.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DetWeave-iOS-simulator-and-Xcode-project-unsigned
          path: packaging/dist/DetWeave-iOS-*.zip
          if-no-files-found: error
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packaging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install briefcase==0.4.7
      - run: briefcase create linux system --target ubuntu:noble --no-input
      - run: briefcase build linux system --target ubuntu:noble --no-input
      - run: briefcase package linux system --target ubuntu:noble --adhoc-sign --no-input
      - name: Verify Debian package metadata
        run: |
          for package in dist/*.deb; do
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
            dpkg-deb -f "$package" Package Version Architecture Depends
          done
      - uses: actions/upload-artifact@v4
        with:
          name: DetWeave-Ubuntu-24.04-amd64
          path: packaging/dist/*.deb
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install briefcase==0.4.7
      - run: briefcase create windows --no-input
        working-directory: packaging
      - run: briefcase build windows --no-input
        working-directory: packaging
      - run: briefcase package windows --no-input
        working-directory: packaging
      - uses: actions/upload-artifact@v4
        with:
          name: DetWeave-Windows-unsigned
          path: packaging/dist/*
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install briefcase==0.4.7
      - run: briefcase create android --no-input
        working-directory: packaging
      - run: briefcase build android --no-input
        working-directory: packaging
      - run: briefcase package android -p debug-apk --no-input
        working-directory: packaging
      - uses: actions/upload-artifact@v4
        with:
          name: DetWeave-Android-debug-only
          path: packaging/dist/*
          if-no-files-found: error
