name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build_distribution:
        description: 'External review addressed; authorize Python distribution build'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m detweave validate examples/sampling.json
      - run: python -m detweave export examples/beamline.json --output local/beamline.zip
  conversation-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/build_dev_ui.py
      - run: node scripts/check_conversation.cjs
      - run: node scripts/check_provider_settings.cjs
  python-distribution:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_distribution }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: DetWeave-Python
          path: dist/*
          if-no-files-found: error
