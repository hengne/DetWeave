name: Native build candidates
on:
  workflow_dispatch:
    inputs:
      review_approved:
        description: 'External review addressed; authorize native candidate compilation'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  macos:
    if: ${{ inputs.review_approved }}
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packaging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install briefcase==0.4.7
      - run: briefcase create macOS --no-input
      - run: briefcase build macOS --no-input
      - run: briefcase package macOS --adhoc-sign --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: DetWeave-macOS-adhoc-candidate
          path: packaging/dist/*.dmg
          if-no-files-found: error
  ios-simulator:
    if: ${{ inputs.review_approved }}
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: packaging
    steps:
      - uses: actions/checkout@v4
      - name: Start iPhone simulator while preparing the build
        run: |
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; a=json.load(sys.stdin)["devices"]; print(next(d["udid"] for g in a.values() for d in g if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          echo "DETWEAVE_SIMULATOR_UDID=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install briefcase==0.4.7
      - run: xcodebuild -showsdks
      - run: briefcase create iOS --no-input
      - run: briefcase build iOS --no-input
      - name: Launch iPhone simulator and verify app service
        run: python smoke_ios.py
      - name: Package simulator app and Xcode project
        run: |
          set -euo pipefail
          APP="build/detweave_native/ios/xcode/build/Debug-iphonesimulator/DetWeave.app"
          test -d "$APP"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$APP" dist/DetWeave-iOS-simulator.zip
          # Include the generated source, resources and Python support dependencies.
          ditto -c -k --sequesterRsrc --keepParent build/detweave_native/ios/xcode dist/DetWeave-iOS-Xcode-project.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DetWeave-iOS-simulator-and-Xcode-project-unsigned
          path: packaging/dist/DetWeave-iOS-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DetWeave-iOS-simulator-validation
          path: packaging/dist/DetWeave-iOS-simulator-*.png
          if-no-files-found: warn
  linux:
    if: ${{ inputs.review_approved }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packaging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install briefcase==0.4.7
      - run: briefcase create linux system --target ubuntu:noble --no-input
      - run: briefcase build linux system --target ubuntu:noble --no-input
      - run: briefcase package linux system --target ubuntu:noble --adhoc-sign --no-input
      - name: Verify Debian package metadata
        run: |
          for package in dist/*.deb; do
            test "$(dpkg-deb -f "$package" Architecture)" = amd64
            dpkg-deb -f "$package" Package Version Architecture Depends
          done
      - uses: actions/upload-artifact@v4
        with:
          name: DetWeave-Ubuntu-24.04-amd64
          path: packaging/dist/*.deb
          if-no-files-found: error
      - name: Smoke test the installed Linux application
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth ./dist/*.deb
          # setup-python adds a toolcache libpython for building. The installed
          # system package must be tested against Ubuntu's runtime library.
          env -u LD_LIBRARY_PATH ldd /usr/bin/detweave_native |
            grep -E 'libpython3\.12\.so\.1\.0 => /(usr/)?lib/x86_64-linux-gnu/'
          native_log=$(mktemp)
          env -u LD_LIBRARY_PATH -u PYTHONHOME -u PYTHONPATH \
            timeout 45s xvfb-run -a /usr/bin/detweave_native >"$native_log" 2>&1 &
          native_pid=$!
          trap 'kill "$native_pid" 2>/dev/null || true; wait "$native_pid" 2>/dev/null || true; cat "$native_log"; rm -f "$native_log"' EXIT
          python - <<'PY'
          import json
          import subprocess
          import time
          import urllib.request

          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          for _ in range(30):
              sockets = subprocess.check_output(["ss", "-Hltpn"], text=True)
              endpoints = [
                  line.split()[3] for line in sockets.splitlines()
                  if '"detweave_native"' in line and line.split()[3].startswith("127.0.0.1:")
              ]
              if endpoints:
                  break
              time.sleep(1)
          else:
              raise SystemExit("The installed DetWeave executable did not start its local service.")
          url = "http://" + endpoints[0]
          with opener.open(url + "/api/examples", timeout=5) as response:
              fixture = json.load(response)[0]
          request = urllib.request.Request(url + "/api/validate",
              data=json.dumps({"model": fixture["model"]}).encode(),
              headers={"Content-Type": "application/json", "X-DetWeave": "1"})
          with opener.open(request, timeout=5) as response:
              report = json.load(response)
          assert report["ready"] and report["instances"]
          print("Installed native application loaded the packaged geometry core and validated its fixture.")
          PY
  windows:
    if: ${{ inputs.review_approved }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install briefcase==0.4.7
      - run: briefcase create windows --no-input
        working-directory: packaging
      - run: briefcase build windows --no-input
        working-directory: packaging
      - run: briefcase package windows --no-input
        working-directory: packaging
      - uses: actions/upload-artifact@v4
        with:
          name: DetWeave-Windows-unsigned
          path: packaging/dist/*
          if-no-files-found: error
      - name: Smoke test the installed Windows application
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/smoke_windows.ps1
  android:
    if: ${{ inputs.review_approved }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install briefcase==0.4.7
      - run: briefcase create android --no-input
        working-directory: packaging
      - run: briefcase build android --no-input
        working-directory: packaging
      - run: briefcase package android -p debug-apk --no-input
        working-directory: packaging
      - uses: actions/upload-artifact@v4
        with:
          name: DetWeave-Android-debug-only
          path: packaging/dist/*
          if-no-files-found: error
