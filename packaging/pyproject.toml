[tool.briefcase]
project_name = "DetWeave"
bundle = "org.detweave"
version = "0.2.0"
url = "https://github.com/hengne/DetWeave"
license = "LicenseRef-DetWeave-NC-Attribution-1.0"
license-files = ["../LICENSE"]
author = "Hengne Li"
author_email = "Hengne.Li@m.scnu.edu.cn"

[tool.briefcase.app.detweave_native]
formal_name = "DetWeave"
description = "Detector geometry workbench"
sources = ["src/detweave_native", "../detweave"]
requires = ["toga>=0.5,<0.6", "jsonschema>=4.18,<5"]

[tool.briefcase.app.detweave_native.macOS]
cleanup_paths = ["**/config-3.11-darwin/python.o", "**/*.a", "**/Python.framework/Versions/*/Resources/Python.app"]

[tool.briefcase.app.detweave_native.android]
android_manifest_application_attrs_extra_content = 'android:usesCleartextTraffic="true"'

[tool.briefcase.app.detweave_native.iOS]
info.UIFileSharingEnabled = true
info.LSSupportsOpeningDocumentsInPlace = true
