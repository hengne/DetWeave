[tool.briefcase]
project_name = "DetWeave"
bundle = "org.detweave"
version = "0.2.0"
url = "https://github.com/hengne/DetWeave"
license = "LicenseRef-DetWeave-NC-Attribution-1.0"
license-files = ["../LICENSE"]
author = "Hengne Li"
author_email = "Hengne.Li@m.scnu.edu.cn"

[tool.briefcase.app.detweave_native]
formal_name = "DetWeave"
description = "Detector geometry workbench"
sources = ["src/detweave_native", "../detweave"]
requires = ["jsonschema==4.17.3", "pyrsistent==0.19.3"]
requirement_installer_args = ["--find-links", "vendor"]

[tool.briefcase.app.detweave_native.macOS]
requires = ["toga-cocoa==0.5.7"]
cleanup_paths = ["**/config-3.11-darwin/python.o", "**/*.a", "**/Python.framework/Versions/*/Resources/Python.app"]

[tool.briefcase.app.detweave_native.windows]
requires = ["toga-winforms==0.5.7"]
license-files = ["license-windows.rtf"]

[tool.briefcase.app.detweave_native.linux]
requires = ["toga-gtk==0.5.7"]

[tool.briefcase.app.detweave_native.linux.system.ubuntu.noble]
system_requires = ["libcairo2-dev", "libgirepository-2.0-dev"]
system_runtime_requires = [
    "gir1.2-gtk-3.0",
    "libgirepository-2.0-0",
    "libcanberra-gtk3-module",
    "gir1.2-webkit2-4.1",
]
system_section = "science"

[tool.briefcase.app.detweave_native.android]
requires = ["toga-android==0.5.7"]
android_manifest_application_attrs_extra_content = 'android:usesCleartextTraffic="true"'

[tool.briefcase.app.detweave_native.iOS]
requires = ["toga-iOS==0.5.7"]
info.UIFileSharingEnabled = true
info.LSSupportsOpeningDocumentsInPlace = true
info.NSAppTransportSecurity.NSAllowsLocalNetworking = true
